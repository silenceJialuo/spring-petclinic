<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'adoptions')}">

<body>
  <section class="warm-panel">
    <h2 th:text="#{adoptPageTitle}">Find Your New Best Friend</h2>
    <p class="warm-subtitle" th:text="#{adoptPageSubtitle}">These pets are currently available for adoption.</p>

    <div th:if="${adoptedPetName}" class="alert alert-success" role="alert">
      <span th:text="#{adoptSuccessPrefix}">You adopted</span>
      <strong th:text="${adoptedPetName}">Pet</strong>
      <span th:text="#{adoptSuccessSuffix}">successfully.</span>
    </div>
    <div th:if="${alreadyAdoptedPetName}" class="alert alert-warning" role="alert">
      <strong th:text="${alreadyAdoptedPetName}">Pet</strong>
      <span th:text="#{adoptAlreadyAdopted}">has already been adopted.</span>
    </div>
  </section>

  <div class="row g-3" th:if="${!#lists.isEmpty(pets)}">
    <div class="col-md-6 col-lg-4" th:each="pet : ${pets}">
      <div class="card adoption-card h-100">
        <div class="card-body">
          <h4 class="card-title" th:text="${pet.name}">Pet</h4>
          <p class="card-text">
            <span th:text="#{type}">Type</span>:
            <strong th:text="${pet.type != null ? pet.type.name : 'Unknown'}">dog</strong>
          </p>
          <p class="card-text" th:if="${pet.birthDate != null}">
            <span th:text="#{birthDate}">Birth Date</span>:
            <strong th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}">2020-01-01</strong>
          </p>

          <form th:action="@{/adoptions/{petId}/adopt(petId=${pet.id})}" method="post">
            <button type="submit" class="btn btn-primary" th:text="#{adopt}">Adopt</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(pets)}" class="alert alert-info mt-3">
    <span th:text="#{noAdoptablePets}">No adoptable pets are available right now.</span>
  </div>

  <section class="warm-panel adopted-panel" th:if="${!#lists.isEmpty(adoptedPets)}">
    <h3 th:text="#{adoptedPetsTitle}">Already Adopted</h3>
  </section>

  <div class="row g-3" th:if="${!#lists.isEmpty(adoptedPets)}">
    <div class="col-md-6 col-lg-4" th:each="pet : ${adoptedPets}">
      <div class="card adoption-card h-100 adopted-card">
        <div class="card-body">
          <h4 class="card-title" th:text="${pet.name}">Pet</h4>
          <p class="card-text">
            <span th:text="#{type}">Type</span>:
            <strong th:text="${pet.type != null ? pet.type.name : 'Unknown'}">dog</strong>
          </p>
          <button type="button" class="btn btn-secondary" disabled th:text="#{adopted}">Adopted</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
